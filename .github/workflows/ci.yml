name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.7.17'
      - run: python tools/dev.py setup
      - run: python tools/dev.py check
        env:
          DO_NOT_TRACK: '1'
          MLFLOW_DISABLE_TELEMETRY: 'true'
          MLFLOW_DISABLE_AGENT_HINT: '1'
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.5'
      - run: terraform -chdir=infrastructure/terraform fmt -check -recursive
      - run: terraform -chdir=infrastructure/terraform init -backend=false -input=false
      - run: terraform -chdir=infrastructure/terraform validate
