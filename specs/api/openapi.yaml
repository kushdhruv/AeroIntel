  /monitoring:
    post:
      tags:
      - monitoring
      summary: Monitor
      operationId: monitor_monitoring_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonitorBody'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Monitor Monitoring Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /reports/{kind}/{key}:
    get:
      tags:
      - reports
      summary: Report
      operationId: report_reports__kind___key__get
      parameters:
      - name: kind
        in: path
        required: true
        schema:
          type: string
          title: Kind
      - name: key
        in: path
        required: true
        schema:
          type: string
          title: Key
      - name: authorization
        in: header
        required: false
