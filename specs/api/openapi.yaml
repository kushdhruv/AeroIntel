  /predictions/{prediction_id}/feedback:
    post:
      tags:
      - monitoring
      summary: Feedback
      operationId: feedback_predictions__prediction_id__feedback_post
      parameters:
      - name: prediction_id
        in: path
        required: true
        schema:
          type: string
          title: Prediction Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackBody'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
                title: Response Feedback Predictions  Prediction Id  Feedback Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
