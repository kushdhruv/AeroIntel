  /modelops/{tool}:
    post:
      tags:
      - modelops
      summary: Modelops
      operationId: modelops_modelops__tool__post
      parameters:
      - name: tool
        in: path
        required: true
        schema:
          type: string
          title: Tool
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolBody'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Modelops Modelops  Tool  Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    FeedbackBody:
      properties:
        mask:
          type: string
          maxLength: 12000000
          title: Mask
      additionalProperties: false
      type: object
      required:
      - mask
      title: FeedbackBody
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    IngestBody:
      properties:
        manifest:
          additionalProperties: true
          type: object
          title: Manifest
        files:
          additionalProperties:
            type: string
          type: object
          maxProperties: 300
          title: Files
      additionalProperties: false
      type: object
      required:
      - manifest
      - files
      title: IngestBody
    MonitorBody:
      properties:
        model_key:
          type: string
          title: Model Key
        start:
          type: string
          title: Start
        end:
          type: string
          title: End
      additionalProperties: false
      type: object
      required:
      - model_key
      - start
      - end
      title: MonitorBody
    OperationBody:
      properties:
        request_id:
          type: string
          maxLength: 200
          minLength: 1
          title: Request Id
      additionalProperties: false
      type: object
      required:
      - request_id
      title: OperationBody
    PredictionBody:
      properties:
        before:
          type: string
          maxLength: 12000000
          title: Before
        after:
          type: string
          maxLength: 12000000
          title: After
        region:
          type: string
          maxLength: 200
          minLength: 1
          title: Region
        request_id:
          type: string
          maxLength: 200
          minLength: 1
          title: Request Id
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Metadata
      additionalProperties: false
      type: object
      required:
      - before
      - after
      - region
      - request_id
      title: PredictionBody
    RunBody:
      properties:
        dataset_key:
          type: string
          maxLength: 200
          minLength: 1
          title: Dataset Key
        config:
          $ref: '#/components/schemas/TrainingConfig'
      additionalProperties: false
      type: object
      required:
      - dataset_key
      title: RunBody
    ToolBody:
      properties:
        arguments:
          additionalProperties: true
          type: object
          title: Arguments
      additionalProperties: false
      type: object
      required:
      - arguments
      title: ToolBody
    TrainingConfig:
      properties:
        epochs:
          type: integer
          maximum: 1000.0
          minimum: 1.0
          title: Epochs
          default: 12
        batch_size:
          type: integer
          maximum: 32.0
          minimum: 1.0
          title: Batch Size
          default: 4
        learning_rate:
          type: number
          maximum: 0.1
          exclusiveMinimum: 0.0
          title: Learning Rate
          default: 0.01
        seed:
          type: integer
          maximum: 4294967295.0
          minimum: 0.0
          title: Seed
          default: 42
        width:
          type: integer
          maximum: 32.0
          minimum: 2.0
          title: Width
          default: 4
        threshold:
          type: number
          exclusiveMaximum: 1.0
          exclusiveMinimum: 0.0
          title: Threshold
          default: 0.5
        block_meters:
          type: number
          exclusiveMinimum: 0.0
          title: Block Meters
          default: 10000
      additionalProperties: false
      type: object
      title: TrainingConfig
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
