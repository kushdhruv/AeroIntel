[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aerointel"
version = "1.0.0"
description = "Local-first geospatial ML trust and operations platform"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3",
  "jsonschema[format]>=4.23,<5", "PyYAML>=6,<7", "filelock>=3.16,<5",
]

[project.optional-dependencies]
ml = ["torch>=2.5,<3", "numpy>=2,<3", "Pillow>=11,<13", "pyproj>=3.7,<4", "rasterio>=1.4,<2"]
tracking = ["mlflow>=2.17,<4"]
geo = ["rasterio>=1.4,<2", "geopandas>=1,<2", "torchgeo>=0.6,<1"]
monitoring = ["evidently>=0.7,<0.8", "pandas>=2.2,<3", "opentelemetry-api>=1.28,<2", "opentelemetry-sdk>=1.28,<2"]
mcp = ["mcp>=1,<2"]
aws = ["boto3>=1.35,<2"]
dev = ["pytest>=8,<10", "hypothesis>=6,<7", "httpx>=0.27,<1", "ruff>=0.9,<1", "mypy>=1.14,<2", "types-PyYAML", "types-jsonschema", "moto[s3,sqs]>=5,<6"]

[project.scripts]
aerointel = "app.cli.main:main"
aerointel-mcp = "modules.modelops.mcp.server:main"

[tool.setuptools.packages.find]
include = ["app*", "contracts*", "modules*", "adapters*", "specs*"]

[tool.setuptools.package-data]
specs = ["models/*.json", "events/*.json", "policies/*.yaml", "api/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["app", "contracts", "modules", "adapters"]
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["torch.*", "numpy.*", "pandas.*", "scipy.*", "mlflow.*", "evidently.*", "pyproj.*", "rasterio.*", "mcp.*", "boto3.*", "botocore.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
